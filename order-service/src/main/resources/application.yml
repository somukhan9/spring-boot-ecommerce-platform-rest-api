server:
  port: 8083
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:order_svc}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100

app:
  security:
    internal-secret: ${INTERNAL_SECRET}

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
