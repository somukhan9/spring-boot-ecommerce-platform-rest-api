server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${DB_USERNAME:product_svc}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    web:
      pageable:
        max-page-size: 100

app:
  security:
    internal-secret: ${INTERNAL_SECRET}      # NOTE: no JWT secret here - this service cannot forge user tokens

management:
  endpoints:
    web:
      exposure:
        include: health
